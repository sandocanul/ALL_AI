<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIG AI Platform</title>
    <!-- Librărie pentru formatare Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <!-- Ecranul de Autentificare -->
    <!-- Containerul pentru Autentificare -->
<div id="auth-container" class="auth-box">
    <h2>Bine ai venit!</h2>
    
    <input type="text" id="username" placeholder="Nume utilizator" required>
    <input type="password" id="password" placeholder="Parolă" required>
    
    <!-- Am adăugat un container pentru butoane ca să stea frumos unul lângă altul -->
    <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button onclick="login()" style="flex: 1; background-color: #3b82f6; color: white;">Logare</button>
        <button onclick="register()" style="flex: 1; background-color: #10b981; color: white;">Creare cont</button>
    </div>

    <!-- Un paragraf unde vom afișa erorile (ex: "Parolă greșită") -->
    <p id="auth-message" style="color: #ef4444; margin-top: 10px; font-size: 14px; text-align: center;"></p>
</div>

   <!-- Containerul principal de Chat -->
    <div id="chat-container" class="hidden">
        <!-- BUTONUL NOU PENTRU TELEFON -->
    <button id="mobile-menu-btn" onclick="toggleSidebar()">☰ Meniu</button>
        <!-- NOU: Sidebar-ul din stânga -->
        <div class="sidebar">
            <button onclick="createNewSession()" class="new-chat-btn">➕ Chat Nou</button>
            <div id="sessions-list">
                <!-- Aici vor apărea conversațiile -->
            </div>
            <button onclick="logout()" class="logout-btn">Ieșire Cont</button>
        </div>

        <!-- Zona principală de conversație -->
        <div class="main-chat">
            <div class="chat-header">
                <div class="header-left">
                    <h3>BIG AI 🤖</h3>
                </div>
                <div class="header-right">
                    <select id="model-selector" class="model-dropdown">
                        <option value="groq">Groq</option>
                        <option value="gemini">Gemini</option>
                        <option value="llama">Open router</option>
                    </select>
                    <div class="credits">
    Credite: <span id="credit-count">---</span>
    <!-- BUTON NOU: -->
    <button onclick="buyCredits()" class="buy-btn" style="background-color: #6366f1; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-left: 10px; font-weight: bold;">
        💳 Cumpără Credite
    </button>
</div>
                </div>
            </div>
            
            <div id="chat-box"></div>
            
           <!-- Aceasta este zona din interiorul "chat-screen", sub "chat-box" -->
<div class="chat-input-container">
    <!-- 1. AM CORECTAT ID-UL AICI: message-input -->
    <input type="text" id="message-input" placeholder="Scrie un mesaj către AI..." autocomplete="off">
    
    
<!-- Bifa pentru Quick Chat (Incognito) -->
    <div style="display: flex; align-items: center; gap: 5px; color: white; font-size: 14px;">
        <input type="checkbox" id="quick-chat-toggle">
        <label for="quick-chat-toggle" title="Nu salvează în istoric">Incognito</label>
    </div>
    <button id="image-quick-btn" title="Generează Imagine" onclick="insertImageCommand()" style="background: none; border: none; font-size: 24px; cursor: pointer;">🎨</button>
    
    <button onclick="sendMessage()" class="send-btn">
        <span>Trimite</span> 
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576zm6.787-8.201L1.591 6.602l4.339 2.76z"/></svg>
    </button>
</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
